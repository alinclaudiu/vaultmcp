name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Lint + unit tests. No DB needed; runs on every push/PR.
  # ---------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -m "not e2e" -v

  # ---------------------------------------------------------------
  # End-to-end tests. Spin up Postgres 17 with pgvector pre-installed
  # via the official pgvector/pgvector image. Provision the test role
  # + extension + CREATEROLE in a setup step before pytest runs.
  # ---------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Provision test database
        env:
          PGPASSWORD: postgres
        run: |
          # Create the vaultmcp role + database + pgvector extension
          # mirroring the operator-side steps in deploy/README.md.
          psql -h localhost -U postgres -d postgres <<'SQL'
            CREATE ROLE vaultmcp LOGIN PASSWORD 'vaultmcp_ci' CREATEROLE;
            CREATE DATABASE vaultmcp OWNER vaultmcp;
          SQL
          psql -h localhost -U postgres -d vaultmcp -c "CREATE EXTENSION vector;"

      - name: E2E tests
        env:
          VAULTMCP_TEST_DATABASE_URL: postgres://vaultmcp:vaultmcp_ci@localhost:5432/vaultmcp?sslmode=disable
        run: pytest -m e2e -v
