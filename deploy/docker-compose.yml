# VaultMCP local-development stack.
#
# Run with:
#     docker compose up -d
# Then:
#     export VAULTMCP_DATABASE_URL=postgres://vaultmcp:vaultmcp@localhost:5432/vaultmcp
#     export VAULTMCP_WIKI_DIR=/tmp/vaultmcp-wiki
#     vaultmcp-master migrate
#     vaultmcp-master serve
#
# The master and agents are run from the host (not in containers) for v0.2,
# so you can iterate quickly. Containerization of the master/agent images
# is planned for v0.3 along with auth.

services:
  postgres:
    image: postgres:15
    container_name: vaultmcp-postgres
    environment:
      POSTGRES_USER: vaultmcp
      POSTGRES_PASSWORD: vaultmcp
      POSTGRES_DB: vaultmcp
    ports:
      - "5432:5432"
    volumes:
      - vaultmcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultmcp -d vaultmcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultmcp_pgdata:
